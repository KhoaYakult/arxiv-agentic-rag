[project]
name = "arxiv-agentic-rag"
version = "0.1.0"
description = "Corrective-RAG question answering over ArXiv PDF papers"
requires-python = ">=3.11"

# Runtime deps: PHAI khop tung dong voi requirements.txt (Dockerfile/CI dung file do).
# Vercel doc pyproject.toml TRUOC requirements.txt - neu danh sach nay rong, Vercel
# khong cai gi va moi request deu 500 (da xay ra that). tests/test_dependency_sync.py
# bao loi neu 2 file lech nhau. Dev deps o requirements-dev.txt.
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "langchain-text-splitters==1.1.2",
    "cohere==7.1.1",
    "langchain-core==1.6.2",
    "langchain-groq==1.1.3",
    "langchain-google-genai==4.4.0",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "orjson==3.12.0",
    "asyncpg==0.31.0",
    "pgvector==0.5.0",
    "tenacity==9.1.4",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]

# Vercel: FastAPI instance `app` nam o app/api/main.py (khong phai vi tri mac dinh
# app.py/main.py/index.py nen phai khai bao). Key trong vercel.json `functions`
# phai la file tuong ung: "app/api/main.py".
[tool.vercel]
entrypoint = "app.api.main:app"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data", "cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501", # line length: nhieu docstring/comment tieng Viet dai, khong dang de bat
    "E402", # moi module co sys.path.insert(...) truoc import de ho tro chay `python app/x/y.py` truc tiep - day la quy uoc co chu dich cua repo, khong phai loi
    "B904", # raise...from e trong except: cac endpoint FastAPI hien tai co nhieu cho raise HTTPException(...) khong chain - se don dep khi refactor /upload o Phase 2 (BackgroundTasks), khong sua rai rac o day
]

[tool.ruff.lint.per-file-ignores]
# FastAPI dung File(...)/Form(...)/Depends(...) lam gia tri mac dinh - day la
# idiom chuan cua framework, khong phai bug "mutable default argument".
"app/api/routes.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
